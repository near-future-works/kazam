<!DOCTYPE html>
<html lang="en" class="kz-root dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazam</title>
<script src="kazam.js"></script>
<style>
  /* Host chrome. Reuses Kazam's injected tokens + component CSS (kz-*). */
  body { margin: 0; }
  .host { display: grid; grid-template-columns: 340px 1fr; height: 100vh;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: hsl(var(--background)); color: hsl(var(--foreground)); }
  .host-side { background: hsl(var(--card)); border-right: 1px solid hsl(var(--border)); overflow-y: auto; }
  .host-top { padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
  .host-top .brand { font-size: 13px; font-weight: 600; }
  .host-top .spacer { flex: 1; }
  .host-theme { width: 26px; height: 26px; border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
    background: none; color: hsl(var(--muted-foreground)); cursor: pointer; }
  .host-theme:hover { color: hsl(var(--foreground)); }
  .host-toolsel { padding: 0 16px 12px; }
  .host-tooldesc { color: hsl(var(--muted-foreground)); font-size: 11px; line-height: 1.4; margin-top: 8px; }
  .host-tooldesc:empty { display: none; }
  /* collapsible Tool & presets disclosure (power-user moves, tucked away) */
  .host-disc { border-top: 1px solid hsl(var(--border)); }
  .host-disc-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: none; border: none; color: hsl(var(--foreground)); font: inherit; font-weight: 600; font-size: 13px;
    cursor: pointer; padding: 12px 16px; }
  .host-disc-toggle .chev { color: hsl(var(--muted-foreground)); transition: transform .15s; }
  .host-disc-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .host-disc-body { padding: 0 16px 14px; }
  .host-action + .host-action { margin-top: 14px; }
  .host-action .kz-btn { width: 100%; }
  .host-action-desc { font-size: 11px; color: hsl(var(--muted-foreground)); margin-top: 5px; line-height: 1.4; }
  .host-disc-secondary { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 14px; }
  .host-stage { position: relative; overflow: hidden; }
  .host-frame { width: 100%; height: 100%; border: 0; display: block; }
  .host-bar { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px;
    background: hsl(var(--card) / .25); border: 1px solid hsl(var(--border) / .5); border-radius: calc(var(--radius) - 2px); padding: 4px 6px; }
  .host-bar .sw { width: 20px; height: 20px; padding: 0; border: 1px solid hsl(var(--input)); border-radius: 4px; cursor: pointer; background-clip: padding-box; }
  .host-bar .clr { width: 16px; height: 20px; border: none; background: none; color: hsl(var(--muted-foreground)); cursor: pointer; }
  .host-pick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="host">
    <aside class="host-side">
      <div class="host-top">
        <span class="brand">Kazam</span>
        <span class="spacer"></span>
        <button class="host-theme" id="themeBtn" title="Toggle theme">◑</button>
      </div>
      <div class="host-toolsel">
        <select class="kz-select" id="toolSel"></select>
        <div class="host-tooldesc" id="toolDesc"></div>
      </div>
      <div class="host-disc">
        <button class="host-disc-toggle" id="discToggle" aria-expanded="false" aria-controls="discBody">
          <span>Tool settings</span>
          <svg class="chev" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
        </button>
        <div class="host-disc-body" id="discBody" hidden>
          <div class="host-action">
            <button class="kz-btn" id="copySettings">Copy current settings</button>
            <div class="host-action-desc">Paste into Claude to set these as the tool’s default.</div>
          </div>
          <div class="host-action">
            <button class="kz-btn" id="copyHtml">Copy tool as HTML</button>
            <div class="host-action-desc">Send it to a teammate to drop into their own Kazam.</div>
          </div>
          <div class="host-disc-secondary">
            <button class="kz-mini" id="importTool">Import a tool…</button>
            <button class="kz-mini" id="loadPreset">Load settings…</button>
            <button class="kz-mini" id="downloadTool">Download .html</button>
          </div>
          <input type="file" id="importInput" accept=".html,text/html" style="display:none">
        </div>
      </div>
      <div id="controls"></div>
      <div class="kz-section" id="exportSection">
        <div class="kz-sechead"><h2>Export</h2></div>
        <div class="kz-btnrow" id="exportRow"></div>
      </div>
    </aside>
    <main class="host-stage">
      <div class="host-bar">
        <button class="sw" id="pbgSw" title="Preview background"></button>
        <input type="color" class="host-pick" id="pbgPick" value="#ebf1e5">
        <button class="clr" id="pbgClr" title="Transparent">×</button>
      </div>
      <iframe class="host-frame" id="toolFrame"></iframe>
    </main>
  </div>

<script>
const V = Kazam.version;
const CHECKER = "repeating-conic-gradient(#9aa0ac 0% 25%, #f5f6f8 0% 50%) 50% / 12px 12px";

const TOOLS = [
  { id: "dither-shape",    name: "Shape Generator", path: "../tools/dither-shape.html" },
  { id: "dither-gradient", name: "Gradient Dither", path: "../tools/dither-gradient.html" },
  { id: "pixelator",       name: "Pixelator",       path: "../tools/pixelator.html" },
  { id: "orbits",          name: "Orbits",          path: "../tools/orbits.html" },
  { id: "starter",         name: "Starter",         path: "../tools/_template.html" },
];

const frame = document.getElementById("toolFrame");
const controls = document.getElementById("controls");
const exportRow = document.getElementById("exportRow");
let current = null;          // { tool, store, unsub }
let currentPath = null;      // path/URL of the loaded tool file
let reqId = 0; const pending = {};
let importN = 0;
let pbg = "#ebf1e5";         // host-side preview backdrop

const post = msg => frame.contentWindow.postMessage(Object.assign({ v: V }, msg), "*");
const isDark = () => document.documentElement.classList.contains("dark");

// ---- tool switcher ----
const toolSel = document.getElementById("toolSel");
TOOLS.forEach(t => { const o = document.createElement("option"); o.value = t.id; o.textContent = t.name; toolSel.appendChild(o); });
toolSel.addEventListener("change", () => loadTool(TOOLS.find(t => t.id === toolSel.value)));
function loadTool(t) {
  current = null; currentPath = t.path;
  controls.innerHTML = ""; exportRow.innerHTML = "";
  document.getElementById("toolDesc").textContent = "";
  frame.src = t.path;       // framed: the tool's runtime detects window.self !== top
}

// ---- handshake + wiring ----
window.addEventListener("message", e => {
  const d = e.data; if (!d || d.v !== V) return;
  if (d.type === "kazam/ready") onReady(d);
  else if (d.type === "kazam/export-result") onExportResult(d);
});

function onReady(d) {
  const store = Kazam.host.createStore(d.state);
  Kazam.host.buildPanel(controls, { settings: d.schema, groups: d.groups }, store, /* pair */ true);
  const unsub = store.subscribe(() => post({ type: "kazam/state", state: store.get() }));
  current = { tool: d.tool, store, unsub, path: currentPath };
  document.getElementById("toolDesc").textContent = d.tool.tagline || "";

  buildExport(d.tool);

  // initial preview backdrop: tool's hint unless the host already has one
  if (d.tool.preview && d.tool.preview.background && pbg === "#ebf1e5") pbg = d.tool.preview.background;
  applyPbg();
  post({ type: "kazam/tokens", dark: isDark() });
}

// ---- export ----
let scaleSel;
function buildExport(tool) {
  exportRow.innerHTML = "";
  const formats = tool.exportFormats || ["svg", "png"];
  if (formats.includes("svg")) addBtn("SVG", "kz-btn", () => requestExport("svg"));
  if (formats.includes("png")) {
    addBtn("PNG", "kz-btn kz-primary", () => requestExport("png", +scaleSel.value));
    scaleSel = document.createElement("select"); scaleSel.className = "kz-select kz-scale";
    [1, 2, 4].forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s + "×"; if (s === 2) o.selected = true; scaleSel.appendChild(o); });
    exportRow.appendChild(scaleSel);
  }
  if (tool.duration > 0) {  // animated → offer WebM
    const b = addBtn("WebM", "kz-btn", () => {
      if (b.disabled) return; b.disabled = true; const label = b.textContent; b.textContent = "Recording…";
      const id = requestExport("webm");
      pendingDone[id] = () => { b.disabled = false; b.textContent = label; };
    });
  }
}
const pendingDone = {};
function addBtn(text, cls, fn) { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.addEventListener("click", fn); exportRow.appendChild(b); return b; }
function requestExport(format, scale) { const id = ++reqId; pending[id] = { format, scale }; post({ type: "kazam/export", requestId: id, format, scale }); return id; }
function onExportResult(d) {
  const p = pending[d.requestId]; if (!p) return; delete pending[d.requestId];
  if (pendingDone[d.requestId]) { pendingDone[d.requestId](); delete pendingDone[d.requestId]; }
  const id = current.tool.id;
  if (d.payload && d.payload.kind === "text") return Kazam.host.download(new Blob([d.payload.text], { type: "image/svg+xml" }), `${id}.svg`);
  if (!d.payload || !d.payload.blob) return;
  const name = d.format === "png" ? `${id}@${p.scale || 2}x.png` : `${id}.${d.format}`;
  Kazam.host.download(d.payload.blob, name);
}

// ---- tool file: copy / download / import ----
// Inline the host's kazam.js into a tool's source so it becomes a single
// self-contained file (and so blob-URL imports resolve their runtime).
async function inlineRuntime(raw) {
  if (!/src=["'][^"']*kazam\.js["']/i.test(raw)) return raw; // already self-contained
  const rt = await fetch("kazam.js").then(r => r.text());
  return raw.replace(/<script\b[^>]*\bsrc=["'][^"']*kazam\.js["'][^>]*>\s*<\/script>/i, "<script>\n" + rt + "\n<\/script>");
}
async function selfContainedSource() {
  const raw = await fetch(currentPath).then(r => r.text());
  return inlineRuntime(raw);
}
document.getElementById("copyHtml").addEventListener("click", async () => {
  if (current) navigator.clipboard.writeText(await selfContainedSource());
});
document.getElementById("downloadTool").addEventListener("click", async () => {
  if (!current) return;
  Kazam.host.download(new Blob([await selfContainedSource()], { type: "text/html" }), `${current.tool.id}.html`);
});
const importInput = document.getElementById("importInput");
document.getElementById("importTool").addEventListener("click", () => importInput.click());
importInput.addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const html = await inlineRuntime(await file.text());          // inline runtime if the file references it
  const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  const id = "imported-" + (++importN), name = file.name.replace(/\.html?$/i, "");
  const entry = { id, name, path: url };
  TOOLS.push(entry);
  const o = document.createElement("option"); o.value = id; o.textContent = name + " (imported)"; toolSel.appendChild(o);
  toolSel.value = id; loadTool(entry);
});

// ---- disclosure (Tool & presets) ----
const discToggle = document.getElementById("discToggle"), discBody = document.getElementById("discBody");
discToggle.addEventListener("click", () => {
  const open = discToggle.getAttribute("aria-expanded") === "true";
  discToggle.setAttribute("aria-expanded", String(!open));
  discBody.hidden = open;
});

// ---- "Copy current settings": a Claude-ready instruction with an embedded JSON block ----
document.getElementById("copySettings").addEventListener("click", () => {
  if (!current) return;
  const txt =
    `Set these as the default values for the "${current.tool.name}" Kazam tool — ` +
    `update each field's \`default\` in the settings schema to match:\n\n` +
    "```json\n" + current.store.serialise() + "\n```\n";
  navigator.clipboard.writeText(txt);
});
document.getElementById("loadPreset").addEventListener("click", () => {
  if (!current) return;
  const txt = prompt("Paste preset (Markdown or JSON)");
  if (!txt) return;
  const m = txt.match(/```json\s*([\s\S]*?)```/i) || txt.match(/\{[\s\S]*\}/);
  current.store.deserialise(m ? (m[1] || m[0]) : txt);
});

// ---- theme ----
document.getElementById("themeBtn").addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  post({ type: "kazam/tokens", dark: isDark() });
});

// ---- preview backdrop ----
const pbgSw = document.getElementById("pbgSw"), pbgPick = document.getElementById("pbgPick"), pbgClr = document.getElementById("pbgClr");
function applyPbg() { pbgSw.style.background = pbg || CHECKER; post({ type: "kazam/preview-bg", color: pbg || null }); }
pbgSw.addEventListener("click", () => pbgPick.click());
pbgPick.addEventListener("input", () => { pbg = pbgPick.value; applyPbg(); });
pbgClr.addEventListener("click", () => { pbg = null; applyPbg(); });

// ---- boot ----
loadTool(TOOLS[0]);
</script>
</body>
</html>
