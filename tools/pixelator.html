<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixelator</title>
<script src="../frame/kazam.js"></script>
</head>
<body>
<script>
// ---------------------------------------------------------------------------
// Pure helpers (geometry, colour maths, lookup tables) — no DOM, no globals.
// ---------------------------------------------------------------------------

// Curated, on-theme colour pools. The runtime seed picks/jitters from these.
const PALETTES = {
  bauhaus:   ['#D62828','#E63946','#1D3461','#2B6CB0','#F6C012','#E8871E','#2E7D52','#1A1A1A','#F2EDE0','#9B2226','#6D4C9F','#C44536','#3A5A40','#8D99AE','#D9A441'],
  primaries: ['#E4002B','#0057B8','#FFD200','#1A1A1A','#F4F1EA','#2E7D52','#E8871E'],
  earth:     ['#8C5A3C','#C08552','#5E503F','#A68A64','#3B2F2F','#D6C7A1','#7F5539','#B08968','#9C6644'],
  mono:      ['#111111','#2E2E2E','#4D4D4D','#6E6E6E','#909090','#B4B4B4','#D8D8D8','#F2F2F2'],
  pastel:    ['#F7A1C4','#A0D8EF','#FBE7A1','#B5E6C9','#D6BCFA','#FFD8BE','#C9E4DE','#F2D7D9','#CDE7B0'],
};

const BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => (v + 0.5) / 16));

const clamp255 = v => Math.max(0, Math.min(255, Math.round(v)));

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbStr(rgb, a) { return `rgba(${clamp255(rgb[0])},${clamp255(rgb[1])},${clamp255(rgb[2])},${a == null ? 1 : a})`; }
function colorStr(c) { return c ? rgbStr(hexToRgb(c.hex), c.opacity) : 'transparent'; }
function luminance(rgb) { return 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]; }

// Per-channel blend for the harmony pass (matches the original tool).
function blendChannel(b, t, mode) {
  switch (mode) {
    case 'multiply': return b * t;
    case 'screen':   return 1 - (1 - b) * (1 - t);
    case 'overlay':  return b < 0.5 ? 2 * b * t : 1 - 2 * (1 - b) * (1 - t);
    default:         return (1 - 2 * t) * b * b + 2 * t * b; // soft light
  }
}
// Pull a colour toward a shared harmony colour so the palette feels related.
function harmonize(rgb, targetHex, mode, strength) {
  const t = hexToRgb(targetHex);
  const out = [0, 0, 0];
  for (let c = 0; c < 3; c++) {
    const a = rgb[c] / 255, tt = t[c] / 255;
    out[c] = (a + (blendChannel(a, tt, mode) - a) * strength) * 255;
  }
  return out;
}

// Margin auto-sized to one cell: (cols + 2) cells total across the width.
function effectiveMargin(state, cols) {
  return state.marginCell ? Math.round(state.width / (cols + 2)) : state.margin;
}

// Build a seeded palette from a pool: shuffle, take `count`, jitter slightly.
function buildPalette(pool, count, random) {
  const p = pool.slice();
  for (let i = p.length - 1; i > 0; i--) {
    const k = random.int(i + 1);
    [p[i], p[k]] = [p[k], p[i]];
  }
  const out = [];
  for (let i = 0; i < count; i++) {
    const [r, g, b] = hexToRgb(p[i % p.length]);
    const j = () => (random() - 0.5) * 26;
    out.push([clamp255(r + j()), clamp255(g + j()), clamp255(b + j())]);
  }
  return out;
}

// Fill style for one cell — solid, or a same-colour opacity gradient if chosen.
function cellFill(c2d, rgb, x, y, w, h, useGradient, state) {
  if (!useGradient) return rgbStr(rgb, 1);
  const rad = (state.gradAngle * Math.PI) / 180;
  const dx = Math.cos(rad), dy = Math.sin(rad);
  const cx = x + w / 2, cy = y + h / 2;
  const half = (Math.abs(dx) * w + Math.abs(dy) * h) / 2;
  const g = c2d.createLinearGradient(cx - dx * half, cy - dy * half, cx + dx * half, cy + dy * half);
  g.addColorStop(0, rgbStr(rgb, state.gradStart));
  g.addColorStop(1, rgbStr(rgb, state.gradEnd));
  return g;
}

Kazam.defineTool({
  id: 'pixelator',
  name: 'Pixelator',
  version: 1,
  render: 'canvas',
  tagline: 'Generative pixel-grid compositions in block, paper-cutout, oil, dithered & movement styles.',
  groups: ['Canvas', 'Palette', 'Composition', 'Monochrome', 'Gradient', 'Texture'],
  preview: { background: '#e9e6df' },
  exportFormats: ['png'],

  settings: {
    // --- Canvas ---
    width:      { type:'number', label:'Width',  group:'Canvas', default:900, min:200, max:2000, step:10, unit:'px', col:'half' },
    height:     { type:'number', label:'Height', group:'Canvas', default:900, min:200, max:2000, step:10, unit:'px', col:'half' },
    resolution: { type:'slider', label:'Resolution', group:'Canvas', default:24, min:4, max:160, step:1, unit:' cells' },
    margin:     { type:'number', label:'Margin', group:'Canvas', default:60, min:0, max:600, step:1, unit:'px', col:'half' },
    marginCell: { type:'toggle', label:'Margin = one cell', group:'Canvas', default:false, col:'half' },
    canvasColor:{ type:'color',  label:'Canvas colour', group:'Canvas', default:{ hex:'#ECE6DA', opacity:1 } },

    // --- Palette (seeded; reroll the seed for a new palette) ---
    paletteTheme: { type:'select', label:'Palette', group:'Palette', default:'bauhaus', options:[
      { value:'bauhaus', label:'Bauhaus' }, { value:'primaries', label:'Primaries' },
      { value:'earth', label:'Earth' }, { value:'mono', label:'Mono' }, { value:'pastel', label:'Pastel' },
    ] },
    colours:        { type:'slider', label:'Colours', group:'Palette', default:12, min:2, max:24, step:1 },
    harmony:        { type:'color',  label:'Harmony tint', group:'Palette', optional:true, default:null },
    harmonyStrength:{ type:'slider', label:'Harmony', group:'Palette', default:0.4, min:0, max:1, step:0.01, format:'percent', col:'half' },
    harmonyMode:    { type:'select', label:'Blend', group:'Palette', default:'soft', col:'half', options:[
      { value:'soft', label:'Soft light' }, { value:'overlay', label:'Overlay' },
      { value:'multiply', label:'Multiply' }, { value:'screen', label:'Screen' },
    ] },

    // --- Composition ---
    whitespace: { type:'slider', label:'Whitespace', group:'Composition', default:0.3, min:0, max:1, step:0.01, format:'percent' },
    artMode:    { type:'select', label:'Art mode', group:'Composition', default:'block', options:[
      { value:'block', label:'Pure block colours' }, { value:'paper', label:'Paper cutout' },
      { value:'oil', label:'Oil painting' }, { value:'mono', label:'Monochrome (dithered)' },
      { value:'movement', label:'Movement' },
    ] },

    // --- Monochrome (only affects the dithered art mode) ---
    inkColor:    { type:'color',  label:'Ink', group:'Monochrome', default:{ hex:'#1A1A1A', opacity:1 }, col:'half' },
    ditherStyle: { type:'select', label:'Dither', group:'Monochrome', default:'floyd', col:'half', options:[
      { value:'floyd', label:'Floyd–Steinberg' }, { value:'ordered', label:'Ordered (Bayer)' },
    ] },
    ditherDot:   { type:'slider', label:'Dot size', group:'Monochrome', default:6, min:1, max:24, step:1, unit:'px' },

    // --- Gradient (per-block opacity ramp) ---
    gradEnabled:  { type:'toggle', label:'Gradient', group:'Gradient', header:true, default:false },
    gradCoverage: { type:'slider', label:'Coverage', group:'Gradient', default:1, min:0, max:1, step:0.01, format:'percent' },
    gradStart:    { type:'slider', label:'Start opacity', group:'Gradient', default:1, min:0, max:1, step:0.01, format:'percent', col:'half' },
    gradEnd:      { type:'slider', label:'End opacity', group:'Gradient', default:0.4, min:0, max:1, step:0.01, format:'percent', col:'half' },
    gradAngle:    { type:'slider', label:'Direction', group:'Gradient', default:90, min:0, max:360, step:1, unit:'°' },

    // --- Texture ---
    noise: { type:'slider', label:'Grain', group:'Texture', default:0, min:0, max:1, step:0.01, format:'percent' },
  },

  size: (state) => ({ width: state.width, height: state.height }),

  build(state, ctx) {
    const c2d = ctx.ctx2d;
    const W = state.width, H = state.height;

    // Layout
    const cols = Math.max(1, Math.round(state.resolution));
    const aspect = W / H;
    const rows = Math.max(1, Math.round(cols / aspect));
    const margin = effectiveMargin(state, cols);
    const innerW = Math.max(1, W - margin * 2);
    const innerH = Math.max(1, H - margin * 2);
    const cellW = innerW / cols, cellH = innerH / rows;
    const ox = margin, oy = margin;

    // Seeded palette, harmonised up front so harmony tints every block.
    let palette = buildPalette(PALETTES[state.paletteTheme] || PALETTES.bauhaus, Math.max(2, state.colours), ctx.random);
    if (state.harmony) {
      palette = palette.map(rgb => harmonize(rgb, state.harmony.hex, state.harmonyMode, state.harmonyStrength));
    }

    // Per-cell colour: order-independent via ctx.random.hash. null = whitespace.
    const cells = new Array(cols * rows);
    for (let gy = 0; gy < rows; gy++) {
      for (let gx = 0; gx < cols; gx++) {
        const i = gy * cols + gx;
        if (ctx.random.hash(gx, gy, 1) < state.whitespace) { cells[i] = null; continue; }
        cells[i] = palette[ctx.random.int ? Math.floor(ctx.random.hash(gx, gy, 2) * palette.length) : 0];
      }
    }

    // Background (exported)
    c2d.fillStyle = colorStr(state.canvasColor);
    c2d.fillRect(0, 0, W, H);

    const gradOn = (gx, gy) =>
      state.gradEnabled && (state.gradCoverage >= 1 || ctx.random.hash(gx, gy, 7) < state.gradCoverage);

    if (state.artMode === 'mono') {
      renderMono(c2d, state, ctx, cells, cols, rows, ox, oy, innerW, innerH, cellW, cellH);
    } else if (state.artMode === 'paper') {
      renderPaper(c2d, state, ctx, cells, cols, rows, ox, oy, cellW, cellH, gradOn);
    } else if (state.artMode === 'oil') {
      renderOil(c2d, state, ctx, cells, cols, rows, ox, oy, cellW, cellH);
    } else if (state.artMode === 'movement') {
      renderMovement(c2d, state, ctx, cells, cols, rows, ox, oy, innerW, innerH, cellW, cellH, gradOn);
    } else {
      renderBlock(c2d, state, cells, cols, rows, ox, oy, cellW, cellH, gradOn);
    }

    if (state.noise > 0) renderNoise(c2d, state, ctx, ox, oy, innerW, innerH);
  },
});

// ---- art-mode renderers (canvas) ----

function renderBlock(c2d, state, cells, cols, rows, ox, oy, cellW, cellH, gradOn) {
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const cell = cells[gy * cols + gx];
    if (!cell) continue;
    const x = Math.floor(ox + gx * cellW), y = Math.floor(oy + gy * cellH);
    const w = Math.ceil(cellW) + 1, h = Math.ceil(cellH) + 1;
    c2d.fillStyle = cellFill(c2d, cell, x, y, w, h, gradOn(gx, gy), state);
    c2d.fillRect(x, y, w, h);
  }
}

function renderPaper(c2d, state, ctx, cells, cols, rows, ox, oy, cellW, cellH, gradOn) {
  const jitter = Math.min(cellW, cellH) * 0.12;
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const cell = cells[gy * cols + gx];
    if (!cell) continue;
    const cx = ox + gx * cellW + cellW / 2, cy = oy + gy * cellH + cellH / 2;
    const dx = (ctx.random.hash(gx, gy, 11) - 0.5) * jitter;
    const dy = (ctx.random.hash(gx, gy, 12) - 0.5) * jitter;
    const rot = (ctx.random.hash(gx, gy, 13) - 0.5) * 0.08;
    const scale = 1.02 + (ctx.random.hash(gx, gy, 14) - 0.5) * 0.06;
    c2d.save();
    c2d.translate(cx + dx, cy + dy);
    c2d.rotate(rot);
    c2d.scale(scale, scale);
    c2d.shadowColor = 'rgba(0,0,0,0.18)';
    c2d.shadowBlur = Math.max(2, Math.min(cellW, cellH) * 0.12);
    c2d.shadowOffsetX = Math.min(cellW, cellH) * 0.05;
    c2d.shadowOffsetY = Math.min(cellW, cellH) * 0.06;
    c2d.fillStyle = cellFill(c2d, cell, -cellW / 2, -cellH / 2, cellW, cellH, gradOn(gx, gy), state);
    c2d.fillRect(-cellW / 2, -cellH / 2, cellW, cellH);
    c2d.restore();
  }
  c2d.shadowColor = 'transparent';
  c2d.shadowBlur = 0; c2d.shadowOffsetX = 0; c2d.shadowOffsetY = 0;
}

function renderOil(c2d, state, ctx, cells, cols, rows, ox, oy, cellW, cellH) {
  c2d.lineCap = 'round';
  const strokeLen = Math.max(cellW, cellH) * 0.6;
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const cell = cells[gy * cols + gx];
    if (!cell) continue;
    const x = ox + gx * cellW, y = oy + gy * cellH;
    c2d.fillStyle = rgbStr(cell, 1);
    c2d.fillRect(x - 1, y - 1, cellW + 2, cellH + 2);
    const angle = (ctx.random.hash(gx, gy, 20) - 0.5) * 0.9 + (gx % 2 ? 0.4 : -0.4);
    for (let s = 0; s < 5; s++) {
      const px = x + ctx.random.hash(gx, gy, 21, s) * cellW;
      const py = y + ctx.random.hash(gx, gy, 22, s) * cellH;
      const len = strokeLen * (0.5 + ctx.random.hash(gx, gy, 23, s) * 0.7);
      const amt = (ctx.random.hash(gx, gy, 24, s) - 0.5) * 46;
      c2d.strokeStyle = rgbStr([cell[0] + amt, cell[1] + amt, cell[2] + amt], 1);
      c2d.lineWidth = Math.max(1, Math.min(cellW, cellH) * (0.12 + ctx.random.hash(gx, gy, 25, s) * 0.14));
      c2d.globalAlpha = 0.6;
      c2d.beginPath();
      c2d.moveTo(px - Math.cos(angle) * len * 0.5, py - Math.sin(angle) * len * 0.5);
      c2d.lineTo(px + Math.cos(angle) * len * 0.5, py + Math.sin(angle) * len * 0.5);
      c2d.stroke();
    }
  }
  c2d.globalAlpha = 1;
}

function renderMovement(c2d, state, ctx, cells, cols, rows, ox, oy, innerW, innerH, cellW, cellH, gradOn) {
  const steps = 12;
  c2d.save();
  c2d.beginPath(); c2d.rect(ox, oy, innerW, innerH); c2d.clip();
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const cell = cells[gy * cols + gx];
    if (!cell) continue;
    const x = ox + gx * cellW, y = oy + gy * cellH;
    if (ctx.random.hash(gx, gy, 30) < 0.3) {
      c2d.globalAlpha = 1; c2d.fillStyle = rgbStr(cell, 1);
      c2d.fillRect(x, y, cellW + 1, cellH + 1); continue;
    }
    const dist = (0.8 + ctx.random.hash(gx, gy, 31) * 1.6) * cellW;
    for (let s = steps; s >= 1; s--) {
      const f = s / steps, off = dist * f;
      c2d.globalAlpha = 0.45 * (1 - f);
      c2d.fillStyle = rgbStr(cell, 1);
      c2d.fillRect(x - off, y - off, cellW + 1, cellH + 1);
    }
    c2d.globalAlpha = 1;
    c2d.fillStyle = cellFill(c2d, cell, x, y, cellW + 1, cellH + 1, gradOn(gx, gy), state);
    c2d.fillRect(x, y, cellW + 1, cellH + 1);
  }
  c2d.globalAlpha = 1;
  c2d.restore();
}

// Monochrome dithering: each cell's tone becomes a halftone of ink dots whose
// density tracks its darkness (Floyd–Steinberg or ordered Bayer).
function renderMono(c2d, state, ctx, cells, cols, rows, ox, oy, innerW, innerH, cellW, cellH) {
  const dot = Math.max(1, state.ditherDot);
  const subCols = Math.ceil(innerW / dot), subRows = Math.ceil(innerH / dot);
  const dark = (sx, sy) => {
    const gx = Math.min(cols - 1, Math.floor((sx * dot) / cellW));
    const gy = Math.min(rows - 1, Math.floor((sy * dot) / cellH));
    const cell = cells[gy * cols + gx];
    return cell ? 1 - luminance(cell) / 255 : 0; // whitespace stays paper
  };
  const ink = new Uint8Array(subCols * subRows);
  if (state.ditherStyle === 'ordered') {
    for (let sy = 0; sy < subRows; sy++) for (let sx = 0; sx < subCols; sx++)
      ink[sy * subCols + sx] = dark(sx, sy) > BAYER4[sy % 4][sx % 4] ? 1 : 0;
  } else {
    const buf = new Float32Array(subCols * subRows);
    for (let sy = 0; sy < subRows; sy++) for (let sx = 0; sx < subCols; sx++) buf[sy * subCols + sx] = dark(sx, sy);
    for (let sy = 0; sy < subRows; sy++) for (let sx = 0; sx < subCols; sx++) {
      const i = sy * subCols + sx, old = buf[i], nv = old > 0.5 ? 1 : 0;
      ink[i] = nv; const err = old - nv;
      if (sx + 1 < subCols) buf[i + 1] += err * 7 / 16;
      if (sy + 1 < subRows) {
        if (sx > 0) buf[i + subCols - 1] += err * 3 / 16;
        buf[i + subCols] += err * 5 / 16;
        if (sx + 1 < subCols) buf[i + subCols + 1] += err * 1 / 16;
      }
    }
  }
  c2d.fillStyle = colorStr(state.inkColor);
  for (let sy = 0; sy < subRows; sy++) for (let sx = 0; sx < subCols; sx++)
    if (ink[sy * subCols + sx]) c2d.fillRect(ox + sx * dot, oy + sy * dot, dot, dot);
}

// Seeded grain overlaid with 'overlay' blend, capped resolution for speed.
function renderNoise(c2d, state, ctx, ox, oy, innerW, innerH) {
  const cap = 700;
  const scale = Math.min(1, cap / Math.max(innerW, innerH));
  const w = Math.max(1, Math.floor(innerW * scale)), h = Math.max(1, Math.floor(innerH * scale));
  const off = document.createElement('canvas'); off.width = w; off.height = h;
  const octx = off.getContext('2d');
  const img = octx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = (ctx.random.hash(x, y, 99) * 255) | 0, o = (y * w + x) * 4;
    img.data[o] = v; img.data[o + 1] = v; img.data[o + 2] = v; img.data[o + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  c2d.save();
  c2d.beginPath(); c2d.rect(ox, oy, innerW, innerH); c2d.clip();
  c2d.imageSmoothingEnabled = false;
  c2d.globalAlpha = state.noise * 0.55;
  c2d.globalCompositeOperation = 'overlay';
  c2d.drawImage(off, ox, oy, innerW, innerH);
  c2d.restore();
}
</script>
</body>
</html>
