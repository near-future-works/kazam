<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starter Tool</title>
<!--
  Minimal worked example for Kazam. Copy this file to start a new tool.
  A tool owns ONLY its settings declaration and its build() function.
  Everything else — panel, controls, preview, export, theming — is the runtime.

  NOTE: requires frame/kazam.js, which lands in Phase 2. Until then this file
  documents the canonical tool shape rather than running.
-->
<script src="../frame/kazam.js"></script>
</head>
<body>
<script>
Kazam.defineTool({
  id: 'starter',
  name: 'Starter',
  version: 1,
  render: 'svg',                      // 'svg' | 'canvas'

  groups: ['Shape', 'Colour'],        // section order for the frame's panel

  settings: {
    size:   { type: 'number', label: 'Size', group: 'Shape',
              default: 400, min: 50, max: 2000, step: 10, unit: 'px' },
    round:  { type: 'slider', label: 'Corner radius', group: 'Shape',
              default: 0, min: 0, max: 0.5, step: 0.01, format: 'percent' },
    fill:   { type: 'color',  label: 'Fill', group: 'Colour',
              default: { hex: '#1f2e1c', opacity: 1 } },
    bg:     { type: 'color',  label: 'Background', group: 'Colour',
              default: null, optional: true },   // starts empty → "Add background"
  },

  // Return an SVGElement. Use ctx.svg() so you never touch the SVG namespace,
  // and ctx.random (never Math.random) so preview always matches export.
  build(state, ctx) {
    const s = state.size;
    const svg = ctx.svg('svg', { width: s, height: s, viewBox: `0 0 ${s} ${s}` });

    if (state.bg) {
      svg.append(ctx.svg('rect', {
        width: s, height: s, fill: state.bg.hex, 'fill-opacity': state.bg.opacity,
      }));
    }

    const r = state.round * (s * 0.8) / 2;
    svg.append(ctx.svg('rect', {
      x: s * 0.1, y: s * 0.1, width: s * 0.8, height: s * 0.8, rx: r,
      fill: state.fill.hex, 'fill-opacity': state.fill.opacity,
    }));

    return svg;
  },

  exportFormats: ['svg', 'png'],
});
</script>
<script>
// Standalone fallback — shown only if frame/kazam.js failed to load (e.g. this tool
// file was opened on its own, away from its Kazam folder). No-op when present.
if (typeof Kazam === 'undefined') document.body.innerHTML =
  '<div style="max-width:34rem;margin:14vh auto;padding:0 1.5rem;font:15px/1.65 -apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;color:#1b1b1b">'
  + '<h1 style="font-size:1.2rem;margin:0 0 .5rem">This is a standalone Kazam design tool</h1>'
  + '<p style="margin:0 0 1rem;color:#555">It needs the Kazam runtime to run, and couldn’t find it.</p>'
  + '<p style="margin:0 0 1rem;color:#555">Get the full toolkit — frame, runtime and tools — at <a href="https://github.com/near-future-works/kazam" style="color:#2b6cff">github.com/near-future-works/kazam</a>, then open this file from inside it.</p>'
  + '<p style="margin:0;color:#8a8a8a;font-size:13px">Sharing just one tool? Use the frame’s “Copy tool as HTML”, which bakes the runtime in so the file runs anywhere on its own.</p>'
  + '</div>';
</script>
</body>
</html>
